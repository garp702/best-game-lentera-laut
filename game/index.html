<title>Lentera Laut — pelayaran malam 1.200 meter</title>
<style>

</style>
</head>

<canvas id="game" aria-label="Lentera Laut: kemudikan kapal lentera, kumpulkan mutiara dan mutiara raja, hindari karang dan pusaran, sampai di 1.200 meter"></canvas>
<p id="status" role="status" aria-live="polite"></p>
